name: Validate Static Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate static site invariants
        run: python scripts/validate_site.py
      - name: Validate workspace security invariants
        run: python scripts/validate_workspace.py
      - name: Check serverless API JavaScript syntax
        run: |
          node --check api/config.js
          node --check api/workspace.js
          node --check api/webhooks/dodo.js
      - name: Check patch whitespace
        run: git diff --check
